# Generates the animated contribution-snake SVG referenced in README.md.
#
# SETUP (one-time):
#   1. Copy this file to  .github/workflows/snake.yml  inside your
#      imkunal01/imkunal01 profile repo (create that repo if it
#      doesn't exist yet — it must be named exactly like your username).
#   2. Repo Settings → Actions → General → Workflow permissions →
#      set to "Read and write permissions", then Save.
#   3. Commit and push. Go to the Actions tab and manually run
#      "Generate Snake Animation" once (workflow_dispatch) so the
#      `output` branch gets created immediately instead of waiting
#      for the next midnight cron run.
#   4. After it succeeds, the image in the README will render.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # once a day at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"
