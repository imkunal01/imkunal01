# Generates 3 self-hosted cards referenced in README.md's "$ git log --stats"
# section: stats.svg, top-langs.svg, streak.svg — colored to match the
# banner.svg palette (near-black bg, gold accent) instead of a stock theme.
# (Trophy card stays on the live github-profile-trophy.vercel.app badge —
# the self-hosting action for it needs more than GITHUB_TOKEN provides and
# lives on an unstable fork branch, not worth the fragility for one card.)
#
# SETUP (one-time):
#   1. Copy this file to .github/workflows/profile-cards.yml in your
#      imkunal01/imkunal01 profile repo.
#   2. Repo Settings → Actions → General → Workflow permissions →
#      set to "Read and write permissions" → Save.
#      (Skip this if you already did it for snake.yml — same setting.)
#   3. Commit and push, then go to the Actions tab and manually run
#      "Update Profile Cards" once (workflow_dispatch) so profile/*.svg
#      gets created immediately instead of waiting for the 3am cron.
#   4. After it succeeds, the 3 cards in the README will render.

name: Update Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"   # once a day at 3am UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&include_all_commits=true&count_private=true&border_radius=10&bg_color=0d0d12&title_color=f5b942&icon_color=f5b942&text_color=e8e8ec&ring_color=f5b942
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&hide_border=true&layout=compact&border_radius=10&bg_color=0d0d12&title_color=f5b942&text_color=e8e8ec
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats card
        uses: muhammad-fiaz/github-readme-streak-stats@v1.0.1
        with:
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKGROUND: "0d0d12"
          RING: "f5b942"
          FIRE: "f5b942"
          STROKE: "3a3a46"
          CURR_STREAK_NUM: "f2f2f0"
          SIDE_NUMS: "f2f2f0"
          CURR_STREAK_LABEL: "f5b942"
          DATES: "8a8a96"
          HIDE_BORDER: "true"
          BORDER_RADIUS: "10"
          OUTPUT_PATH: profile/streak.svg

      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards [skip ci]" || exit 0
          git push
