<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kunal Dhangar — Computer Science Student, Full-Stack Developer">
  <title>Kunal_D — Computer Science Student, Full-Stack Developer</title>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1c1c26" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5b942" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f5b942" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f5b942" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" fill="#0d0d12"/>
  <rect width="1000" height="220" fill="url(#grid)"/>

  <path d="M 28 28 L 28 50 M 28 28 L 50 28" fill="none" stroke="#3a3a46" stroke-width="2"/>
  <path d="M 972 28 L 972 50 M 972 28 L 950 28" fill="none" stroke="#3a3a46" stroke-width="2"/>
  <path d="M 28 192 L 28 170 M 28 192 L 50 192" fill="none" stroke="#3a3a46" stroke-width="2"/>
  <path d="M 972 192 L 972 170 M 972 192 L 950 192" fill="none" stroke="#3a3a46" stroke-width="2"/>

  <rect y="0" width="220" height="3" fill="url(#fade)">
    <animate attributeName="x" from="-220" to="1000" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect y="217" width="220" height="3" fill="url(#fade)">
    <animate attributeName="x" from="1000" to="-220" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <text x="500" y="112" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace" font-weight="700" font-size="44" fill="#f2f2f0">KUNAL_D<tspan fill="#f5b942">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  <text x="500" y="150" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace" font-size="14" letter-spacing="5" fill="#f5b942">COMPUTER SCIENCE STUDENT · FULL-STACK DEVELOPER</text>
</svg>
